name: Lint & Build Mix Assets

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  pint:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: ci-pint-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: 8.2

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

    - name: Get composer cache directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache or restore composer cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

    - name: Run pint
      run: composer lint

    - name: Commit changes
      uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
      with:
          pull: '--rebase --autostash'
          message: 'refactor: fix PHP styling'
          committer_name: github-actions[bot]
          committer_email: github-actions[bot]@users.noreply.github.com

  blade-formatter:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: ci-blade-formatter-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

    - name: Set up node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install packages
      run: npm install

    - name: Run blade-formatter
      run: npm run format

    - name: Commit changes
      uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
      with:
          pull: '--rebase --autostash'
          message: 'refactor: fix blade formatting'
          committer_name: github-actions[bot]
          committer_email: github-actions[bot]@users.noreply.github.com

  rebuild-mix-assets:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Set up node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Run Mix
      run: |
        npm install
        npm run prod

    - name: Commit changes
      uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
      with:
          pull: '--rebase --autostash'
          message: 'chore(deps): rebuild mix assets'
          committer_name: github-actions[bot]
          committer_email: github-actions[bot]@users.noreply.github.com
